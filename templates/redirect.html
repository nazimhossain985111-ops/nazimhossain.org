{% extends "base.html" %}
{% block head %}
<script>location.replace("{{ page.target }}" + location.hash);</script>
{% endblock %}
{% block main %}
<div class="wrap page">
  <h1>{{ page.title }}</h1>
  <p>This page has moved to <a href="{{ page.target }}">{{ page.target }}</a>.</p>
</div>
{% endblock %}
