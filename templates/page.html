{% extends "base.html" %}
{% block main %}
<div class="wrap page">
  {% if page.parent %}
  <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><a href="{{ page.parent.url }}">{{ page.parent.title }}</a></li><li><span aria-current="page">{{ page.title }}</span></li></ol></nav>
  {% endif %}
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ page.body | safe }}</div>
</div>
{% endblock %}
