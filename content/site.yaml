# Site settings for nazimhossain.org.
# After editing, run: python build.py

name: Nazim Hossain
url: https://nazimhossain.org
role: Researcher, disability rights advocate and developer of accessible audio games
description: Nazim Hossain is a researcher from Bangladesh who studies the role of expert knowledge in policy making, works for the rights of people with disabilities and builds audio games for blind and visually impaired players.
intro: I am a Research Fellow at Bangla Academy, studying how expert knowledge shapes policy making in Bangladesh. Alongside research, I work for the rights of people with disabilities, and I build audio games that blind and visually impaired players can enjoy on equal terms with everyone else.
portrait_alt: Portrait of Nazim Hossain in a dark suit, white shirt and red checked tie, against a white background.
email: contact@nazimhossain.org
cv: /cv/Nazim_Hossain_CV.pdf
cv_size: PDF, 212 KB

# The logo links to Home. "also" lists other pages that mark a menu item as current.
nav:
  - {key: research, label: "Research", url: /research/}
  - {key: ongoing-projects, label: "Ongoing Projects", url: /ongoing-projects/}
  - {key: writings, label: "Writings", url: /writings/, also: [blog, book-reviews, poems, short-stories]}
  - {key: games-and-tools, label: "Games and Tools", url: /games-and-tools/}
  - {key: about, label: "About", url: /about/}
  - {key: contact, label: "Contact", url: /contact/}
  - {key: suggestions-and-support, label: "Suggestions and Support", url: /suggestions-and-support/}

# The Highlights cards on the home page, in this order. Each card shows a photo
# from content/photos.yaml (photo:) or a logo (logo: race-master or inclusive-jahangirnagar).
highlights:
  - {text: "Research Fellow at Bangla Academy", url: "/ongoing-projects/#expert-knowledge-in-policy", photo: bangla-academy}
  - {text: "Research Assistant at Jahangirnagar University", url: "/ongoing-projects/#disability-rights-initiative-ju", photo: disability-seminar-speech}
  - {text: "Developer of Race Master, an audio racing game for blind players", url: "/games-and-tools/#race-master", logo: race-master}
  - {text: "Initiator and Chief Coordinator of the Anti-Discrimination Visually Impaired Students' Movement", url: "/about/#movement", photo: movement-public-administration}
  - {text: "Founder and President of Inclusive Jahangirnagar", url: "/about/#inclusive-jahangirnagar", logo: inclusive-jahangirnagar}

footer_links:
  - {label: "Accessibility Statement", url: /accessibility/}
  - {label: "Privacy Policy", url: /privacy/}

